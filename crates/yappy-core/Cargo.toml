[package]
name = "yappy-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
once_cell.workspace = true
ndarray.workspace = true
ort.workspace = true
rand.workspace = true
rand_distr.workspace = true
hound.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
whatlang.workspace = true
# Real-valued FFT for the Parakeet ASR mel-spectrogram front-end (asr::audio).
# Pure-Rust (wraps RustFFT); links cleanly on every target. The ASR ONNX engine
# itself is desktop-gated, but the mel front-end is cheap and harmless to compile
# everywhere, so realfft stays an unconditional dep.
realfft = "3"
# Decodificación de imágenes para el OCR (Amanuensis Ligero, módulo `ocr`). La app ya
# depende de image 0.25, así que no añade compilación.
image = "0.25"

[features]
default = []
# Allow building docs/tests without the heavy ONNX models present.
mock-tts = []

[[bin]]
name = "yappy-cli"
path = "src/bin/cli.rs"
