# Smoke de iOS: arranque en frío → la jerarquía móvil nueva (Escuchar /
# Biblioteca / Ajustes) con la app SIN modelo instalado.
#
# Se corre con maestro/run-all.sh, que desinstala y reinstala Yappy antes
# (el clearState de Maestro no borra los UserDefaults de iOS).
appId: com.joseluissaorin.yappy
---
- launchApp

# ── ESCUCHAR (la raíz del móvil) ────────────────────────────────────────
- extendedWaitUntil:
    visible: "yappy"
    timeout: 10000
# La tarjeta de instalación de voces, porque el modelo no viene en el IPA.
- assertVisible:
    text: ".*380 MB.*"
# La cola vacía con su percha.
- assertVisible:
    text: ".*perch.*|.*percha.*"
# Las dos pestañas de la jerarquía nueva.
- assertVisible:
    text: "Listen|Escuchar"
- assertVisible:
    text: "Library|Biblioteca"
# Nada de conceptos de escritorio en el móvil.
- assertNotVisible: "read what i'm looking at"
- assertNotVisible: "set up browsers"

# ── AÑADIR (el menú de entradas manuales) ──────────────────────────────
- tapOn:
    text: ".*Add.*|.*Añadir.*"
- assertVisible:
    text: "Paste a link|Pegar un enlace"
- assertVisible:
    text: "Read the clipboard|Leer el portapapeles"
- tapOn:
    text: ".*Add.*|.*Añadir.*"

# ── BIBLIOTECA ─────────────────────────────────────────────────────────
- tapOn:
    text: "Library|Biblioteca"
- waitForAnimationToEnd
- assertVisible:
    text: "Audiobooks|Audiolibros"
- assertVisible:
    text: "Documents|Documentos"

# ── VUELTA A ESCUCHAR ──────────────────────────────────────────────────
- tapOn:
    text: "Listen|Escuchar"
- waitForAnimationToEnd
- assertVisible:
    text: ".*Add.*|.*Añadir.*"
