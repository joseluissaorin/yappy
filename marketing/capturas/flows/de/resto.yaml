    text: "(?i)Bauernbrot"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Anhören"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/de/21-lector-a
- extendedWaitUntil:
    visible:
      text: "(?i)ich lese|(?i)läuft"
    timeout: 25000
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: marketing/screenshots/de/22-lector-b
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: marketing/screenshots/de/23-lector-c
- tapOn:
    text: "(?i)zurück"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "8%,9%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/de/24-cinta-sonando
