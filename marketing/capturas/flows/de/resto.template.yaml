appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Okay"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/de/20-cinta
- tapOn:
    text: "die Hinterstube"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Tempo"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "Tempo"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/de/25-trastienda
- tapOn:
    text: "Nacht"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/de/26-trastienda-noche
- tapOn:
    text: "Papier"
    optional: true
- scrollUntilVisible:
    element:
      text: "Papagei aufziehen|Abo verwalten"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/de/27-trastienda-cuerda
- tapOn:
    text: "Papagei aufziehen"
- extendedWaitUntil:
    visible:
      text: "Wähl, wie du ihn aufziehst"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/de/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(de)"
      AppleLocale: "de_DE"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Okay"
    optional: true
- tapOn:
    text: "(?i)die Druckerei öffnen"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/de/29-imprenta
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(de)"
      AppleLocale: "de_DE"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Okay"
    optional: true
- tapOn:
    text: "(?i)__TITULO__"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Anhören"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/de/21-lector-a
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots/de/22-lector-b
- waitForAnimationToEnd:
