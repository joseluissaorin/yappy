appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Selvä"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/fi/20-cinta
- tapOn:
    text: "takahuone"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Nopeus"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "Nopeus"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/fi/25-trastienda
- tapOn:
