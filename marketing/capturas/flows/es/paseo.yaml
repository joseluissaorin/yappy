appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: "Hola, soy tu loro"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/es/01-paseo-hola
- tapOn:
    text: "Elígeme una voz"
- extendedWaitUntil:
    visible:
      text: "Todo pasa en tu teléfono"
    timeout: 10000
- tapOn:
    text: "Français"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/es/02-paseo-idiomas
- tapOn:
    text: "Sigue"
- extendedWaitUntil:
    visible:
      text: "Elige tu pájaro"
    timeout: 10000
- tapOn:
    text: "James"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/es/03-paseo-pajaro
- tapOn:
    text: "Me quedo con James"
- extendedWaitUntil:
    visible:
      text: "¿Qué me vas a dar\\?"
    timeout: 10000
- tapOn:
    text: "Artículos"
- tapOn:
    text: "Libros"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/es/04-paseo-que
