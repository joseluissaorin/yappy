      text: "¿A qué velocidad\\?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/es/06-paseo-velocidad
- tapOn:
    text: "Sigue"
- extendedWaitUntil:
    visible:
      text: "¿Cuánto tienes por leer\\?"
    timeout: 10000
- tapOn:
    text: "Una montaña"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/es/07-paseo-cuanto
- tapOn:
    text: "Sigue"
- extendedWaitUntil:
    visible:
      text: "Lo tuyo, o un cuento"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/es/08-paseo-escucha
- tapOn:
    text: "(?i)Luego"
- extendedWaitUntil:
    visible:
      text: "La pantalla es el botón"
    timeout: 10000
- tapOn:
    text: "(?i)Luego"
