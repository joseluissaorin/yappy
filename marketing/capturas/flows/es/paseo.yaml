    visible:
      text: "Compartir es todo"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/es/09-paseo-compartir
- tapOn:
    text: "(?i)Luego"
- extendedWaitUntil:
    visible:
      text: "Y te lo llevas puesto"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/es/10-paseo-exportar
- tapOn:
    text: "(?i)Luego"
- extendedWaitUntil:
    visible:
      text: "Fíjame en tus favoritos"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/es/11-paseo-favoritos
- tapOn:
    text: "Hecho"
