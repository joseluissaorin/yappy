    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/es/14-paseo-cuerda
- scrollUntilVisible:
    element:
      text: "Empezar con tres en la percha"
    direction: DOWN
    timeout: 15000
- takeScreenshot: marketing/screenshots/es/15-paseo-cuerda-pie
- tapOn:
    text: "Empezar con tres en la percha"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Vale"
    optional: true
- takeScreenshot: marketing/screenshots/es/17-cinta-vacia
