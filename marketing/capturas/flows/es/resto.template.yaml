appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Vale"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/es/20-cinta
- tapOn:
    text: "la trastienda"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Velocidad"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "Velocidad"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/es/25-trastienda
- tapOn:
    text: "Noche"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/es/26-trastienda-noche
- tapOn:
    text: "Papel"
    optional: true
- scrollUntilVisible:
    element:
      text: "Dar cuerda al loro|Gestionar la suscripción"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/es/27-trastienda-cuerda
- tapOn:
    text: "Dar cuerda al loro"
- extendedWaitUntil:
    visible:
      text: "Elige tu cuerda"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/es/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(es)"
      AppleLocale: "es_ES"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Vale"
    optional: true
- tapOn:
    text: "(?i)abrir la imprenta"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/es/29-imprenta
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(es)"
      AppleLocale: "es_ES"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Vale"
    optional: true
- tapOn:
    text: "(?i)__TITULO__"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Escuchar"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/es/21-lector-a
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots/es/22-lector-b
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots/es/23-lector-c
- takeScreenshot: marketing/screenshots/es/24-cinta-sonando
