appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "حسنًا"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ar/20-cinta
- tapOn:
    text: "الغرفة الخلفية"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "السرعة"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "السرعة"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ar/25-trastienda
- tapOn:
    text: "ليل"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/ar/26-trastienda-noche
- tapOn:
    text: "ورق"
    optional: true
- scrollUntilVisible:
    element:
      text: "أدِر مفتاح الببغاء|إدارة الاشتراك"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ar/27-trastienda-cuerda
- tapOn:
    text: "أدِر مفتاح الببغاء"
- extendedWaitUntil:
    visible:
      text: "اختر لفّة مفتاحك"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ar/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(ar)"
      AppleLocale: "ar_AR"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "حسنًا"
    optional: true
- tapOn:
    text: "(?i)افتح المطبعة"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ar/29-imprenta
- launchApp:
