    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/pl/27-trastienda-cuerda
- tapOn:
    text: "Nakręć papugę"
- extendedWaitUntil:
    visible:
      text: "Wybierz swoją sprężynę"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/pl/28-paywall
