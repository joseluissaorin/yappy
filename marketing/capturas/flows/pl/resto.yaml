- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/pl/20-cinta
- tapOn:
    text: "(?i)Chleb wiejski"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Słuchaj"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/pl/21-lector-a
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots/pl/22-lector-b
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots/pl/23-lector-c
# Un toque pausa y descubre la cabecera; luego la flecha de volver.
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "(?i)wróć"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: "8%,10%"
