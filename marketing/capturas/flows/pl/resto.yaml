    point: "8%,10%"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    text: "zaplecze"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Prędkość"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "Prędkość"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/pl/25-trastienda
- tapOn:
    text: "Noc"
