appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "네"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ko/20-cinta
- tapOn:
    text: "무대 뒤"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "속도"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "속도"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ko/25-trastienda
- tapOn:
    text: "밤"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/ko/26-trastienda-noche
- tapOn:
    text: "종이"
    optional: true
- scrollUntilVisible:
    element:
      text: "앵무새 태엽 감기|구독 관리"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ko/27-trastienda-cuerda
- tapOn:
    text: "앵무새 태엽 감기"
- extendedWaitUntil:
    visible:
      text: "태엽을 골라 주세요"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ko/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(ko)"
      AppleLocale: "ko_KO"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "네"
    optional: true
- tapOn:
    text: "(?i)인쇄소 열기"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ko/29-imprenta
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(ko)"
      AppleLocale: "ko_KO"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "네"
    optional: true
- tapOn:
    text: "(?i)__TITULO__"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "듣기"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ko/21-lector-a
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots/ko/22-lector-b
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots/ko/23-lector-c
- takeScreenshot: marketing/screenshots/ko/24-cinta-sonando
