appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "네"
    optional: true
# Abrir la boca solo si no está ya abierta (un fallo anterior la deja abierta).
- runFlow:
    when:
      notVisible:
        text: "복사한 것 붙여넣기"
    commands:
      - tapOn:
          point: "86%,91%"
- extendedWaitUntil:
    visible:
      text: "복사한 것 붙여넣기"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: marketing/screenshots/ko/16-boca
- tapOn:
    text: "복사한 것 붙여넣기"
- tapOn:
    text: "Permitir pegar|Allow Paste"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
