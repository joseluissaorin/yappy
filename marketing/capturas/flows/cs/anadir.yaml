appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Dobře"
    optional: true
# Abrir la boca solo si no está ya abierta (un fallo anterior la deja abierta).
- runFlow:
    when:
      notVisible:
        text: "Vložit zkopírované"
    commands:
      - tapOn:
          point: "86%,91%"
- extendedWaitUntil:
    visible:
      text: "Vložit zkopírované"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: marketing/screenshots/cs/16-boca
- tapOn:
    text: "Vložit zkopírované"
- tapOn:
    text: "Permitir pegar|Allow Paste"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
