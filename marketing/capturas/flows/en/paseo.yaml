appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: "Hi, I'm your parrot"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/en/01-paseo-hola
- tapOn:
    text: "Pick me a voice"
- extendedWaitUntil:
    visible:
      text: "Everything happens on your phone"
    timeout: 10000
- tapOn:
    text: "Français"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/en/02-paseo-idiomas
- tapOn:
    text: "Next"
- extendedWaitUntil:
    visible:
      text: "Pick your bird"
    timeout: 10000
- tapOn:
    text: "James"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/en/03-paseo-pajaro
- tapOn:
    text: "I'll take James"
- extendedWaitUntil:
    visible:
      text: "What will you give me\\?"
    timeout: 10000
- tapOn:
    text: "Articles"
- tapOn:
    text: "Books"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/en/04-paseo-que
- tapOn:
    text: "Next"
- extendedWaitUntil:
    visible:
      text: "When do you listen\\?"
    timeout: 10000
- tapOn:
    text: "Cooking"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/en/05-paseo-cuando
- tapOn:
    text: "Next"
- extendedWaitUntil:
    visible:
      text: "How fast\\?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/en/06-paseo-velocidad
- tapOn:
    text: "Next"
- extendedWaitUntil:
    visible:
      text: "How much do you have to read\\?"
    timeout: 10000
- tapOn:
    text: "A mountain"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/en/07-paseo-cuanto
- tapOn:
    text: "Next"
- extendedWaitUntil:
    visible:
      text: "Something of yours, or a story"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/en/08-paseo-escucha
- tapOn:
    text: "(?i)Later"
- extendedWaitUntil:
    visible:
      text: "The screen is the button"
    timeout: 10000
- tapOn:
    text: "(?i)Later"
- extendedWaitUntil:
    visible:
      text: "Sharing is everything"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/en/09-paseo-compartir
- tapOn:
    text: "(?i)Later"
- extendedWaitUntil:
    visible:
      text: "And you take it with you"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/en/10-paseo-exportar
- tapOn:
    text: "(?i)Later"
- extendedWaitUntil:
    visible:
      text: "Pin me to your favourites"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/en/11-paseo-favoritos
- tapOn:
    text: "Done"
- extendedWaitUntil:
    visible:
      text: "Your parrot"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/en/12-paseo-resumen
- tapOn:
    text: "Next"
- extendedWaitUntil:
    visible:
      text: "Three at a time"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/en/13-paseo-percha
- tapOn:
    text: "Next"
- extendedWaitUntil:
    visible:
      text: "Pick your winding"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/en/14-paseo-cuerda
- scrollUntilVisible:
    element:
      text: "Start with three on the perch"
    direction: DOWN
    timeout: 15000
- takeScreenshot: marketing/screenshots/en/15-paseo-cuerda-pie
- tapOn:
    text: "Start with three on the perch"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Okay"
    optional: true
- takeScreenshot: marketing/screenshots/en/17-cinta-vacia
