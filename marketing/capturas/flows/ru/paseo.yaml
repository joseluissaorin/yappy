appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: "Привет, я твой попугай"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ru/01-paseo-hola
- tapOn:
    text: "Выбери мне голос"
- extendedWaitUntil:
    visible:
      text: "Всё происходит на твоём телефоне"
    timeout: 10000
- tapOn:
    text: "Français"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/ru/02-paseo-idiomas
- tapOn:
    text: "Далее"
- extendedWaitUntil:
    visible:
      text: "Выбери свою птицу"
    timeout: 10000
- tapOn:
    text: "James"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/ru/03-paseo-pajaro
- tapOn:
    text: "Останавливаюсь на James"
- extendedWaitUntil:
    visible:
      text: "Что ты мне дашь\\?"
    timeout: 10000
- tapOn:
    text: "Статьи"
- tapOn:
    text: "Книги"
- waitForAnimationToEnd:
    timeout: 2000
