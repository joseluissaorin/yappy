    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ru/13-paseo-percha
- tapOn:
    text: "Далее"
- extendedWaitUntil:
    visible:
      text: "Выбери, как завести попугая"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ru/14-paseo-cuerda
- scrollUntilVisible:
