    timeout: 2000
- takeScreenshot: marketing/screenshots/ru/05-paseo-cuando
- tapOn:
    text: "Далее"
- extendedWaitUntil:
    visible:
      text: "С какой скоростью\\?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ru/06-paseo-velocidad
- tapOn:
    text: "Далее"
- extendedWaitUntil:
    visible:
      text: "Сколько у тебя есть для чтения\\?"
    timeout: 10000
- tapOn:
    text: "Целая гора"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ru/07-paseo-cuanto
- tapOn:
    text: "Далее"
- extendedWaitUntil:
    visible:
      text: "Твоё, или история"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ru/08-paseo-escucha
- tapOn:
    text: "(?i)Позже"
- extendedWaitUntil:
    visible:
      text: "Экран и есть кнопка"
    timeout: 10000
- tapOn:
    text: "(?i)Позже"
- extendedWaitUntil:
    visible:
      text: "Поделиться решает всё"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/ru/09-paseo-compartir
- tapOn:
    text: "(?i)Позже"
- extendedWaitUntil:
    visible:
      text: "И забираешь это с собой"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ru/10-paseo-exportar
- tapOn:
    text: "(?i)Позже"
- extendedWaitUntil:
    visible:
