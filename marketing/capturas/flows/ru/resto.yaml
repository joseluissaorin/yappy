appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Хорошо"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ru/20-cinta
- tapOn:
    text: "подсобка"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Скорость"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "Скорость"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ru/25-trastienda
- tapOn:
    text: "Ночь"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/ru/26-trastienda-noche
- tapOn:
    text: "Бумага"
    optional: true
- scrollUntilVisible:
    element:
      text: "Завести попугая|Управлять подпиской"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ru/27-trastienda-cuerda
- tapOn:
    text: "Завести попугая"
- extendedWaitUntil:
    visible:
      text: "Выбери, как завести попугая"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ru/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(ru)"
      AppleLocale: "ru_RU"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Хорошо"
    optional: true
- tapOn:
    text: "(?i)открыть печатню"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ru/29-imprenta
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(ru)"
      AppleLocale: "ru_RU"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Хорошо"
    optional: true
- tapOn:
    text: "(?i)Деревенский хлеб"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Слушать"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ru/21-lector-a
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots/ru/22-lector-b
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots/ru/23-lector-c
- takeScreenshot: marketing/screenshots/ru/24-cinta-sonando
