- runFlow:
    when:
      notVisible:
        text: "Ταχύτητα"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "Ταχύτητα"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/el/25-trastienda
