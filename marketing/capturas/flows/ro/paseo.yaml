    text: "(?i)Mai târziu"
- extendedWaitUntil:
    visible:
      text: "Și îl iei cu tine"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ro/10-paseo-exportar
- tapOn:
    text: "(?i)Mai târziu"
- extendedWaitUntil:
