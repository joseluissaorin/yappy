appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: "Bună, sunt papagalul tău"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/ro/01-paseo-hola
- tapOn:
    text: "Alege-mi o voce"
- extendedWaitUntil:
    visible:
      text: "Totul se întâmplă pe telefonul tău"
    timeout: 10000
- tapOn:
    text: "Français"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/ro/02-paseo-idiomas
- tapOn:
    text: "Continuă"
- extendedWaitUntil:
    visible:
      text: "Alege-ți pasărea"
    timeout: 10000
- tapOn:
    text: "James"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/ro/03-paseo-pajaro
- tapOn:
    text: "Rămân cu James"
- extendedWaitUntil:
    visible:
      text: "Ce-mi dai\\?"
    timeout: 10000
- tapOn:
