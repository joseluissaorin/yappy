- takeScreenshot: marketing/screenshots/ro/06-paseo-velocidad
- tapOn:
    text: "Continuă"
- extendedWaitUntil:
    visible:
      text: "Cât ai de citit\\?"
    timeout: 10000
- tapOn:
    text: "Un munte"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/ro/07-paseo-cuanto
- tapOn:
    text: "Continuă"
- extendedWaitUntil:
