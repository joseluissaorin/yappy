appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: "Olá, sou o teu papagaio"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/pt/01-paseo-hola
- tapOn:
    text: "Escolhe-me uma voz"
- extendedWaitUntil:
    visible:
      text: "Tudo acontece no teu telemóvel"
    timeout: 10000
- tapOn:
    text: "Français"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/pt/02-paseo-idiomas
- tapOn:
    text: "Continuar"
- extendedWaitUntil:
    visible:
      text: "Escolhe o teu pássaro"
    timeout: 10000
- tapOn:
    text: "James"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/pt/03-paseo-pajaro
- tapOn:
    text: "Fico com James"
- extendedWaitUntil:
    visible:
      text: "O que me vais dar\\?"
    timeout: 10000
- tapOn:
    text: "Artigos"
- tapOn:
    text: "Livros"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/pt/04-paseo-que
- tapOn:
    text: "Continuar"
