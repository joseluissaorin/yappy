      text: "Escolhe a tua corda"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/pt/14-paseo-cuerda
- scrollUntilVisible:
    element:
      text: "Começar com três no poleiro"
    direction: DOWN
    timeout: 15000
- takeScreenshot: marketing/screenshots/pt/15-paseo-cuerda-pie
- tapOn:
    text: "Começar com três no poleiro"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Está bem"
    optional: true
- takeScreenshot: marketing/screenshots/pt/17-cinta-vacia
