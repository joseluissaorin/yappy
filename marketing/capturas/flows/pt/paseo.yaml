      text: "Quando me ouves\\?"
    timeout: 10000
- tapOn:
    text: "A cozinhar"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/pt/05-paseo-cuando
- tapOn:
    text: "Continuar"
- extendedWaitUntil:
    visible:
      text: "A que velocidade\\?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/pt/06-paseo-velocidad
- tapOn:
    text: "Continuar"
- extendedWaitUntil:
    visible:
      text: "Quanto tens para ler\\?"
    timeout: 10000
- tapOn:
    text: "Uma montanha"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/pt/07-paseo-cuanto
- tapOn:
    text: "Continuar"
- extendedWaitUntil:
    visible:
      text: "O teu, ou um conto"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/pt/08-paseo-escucha
- tapOn:
    text: "(?i)Mais tarde"
- extendedWaitUntil:
    visible:
      text: "O ecrã é o botão"
    timeout: 10000
- tapOn:
    text: "(?i)Mais tarde"
- extendedWaitUntil:
    visible:
      text: "Partilhar é tudo"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/pt/09-paseo-compartir
- tapOn:
    text: "(?i)Mais tarde"
- extendedWaitUntil:
    visible:
      text: "E levas isso contigo"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/pt/10-paseo-exportar
- tapOn:
    text: "(?i)Mais tarde"
- extendedWaitUntil:
    visible:
      text: "Fixa-me nos teus favoritos"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/pt/11-paseo-favoritos
- tapOn:
    text: "Pronto"
- extendedWaitUntil:
    visible:
      text: "O teu papagaio"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/pt/12-paseo-resumen
- tapOn:
    text: "Continuar"
