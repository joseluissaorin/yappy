appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "V redu"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/sl/20-cinta
- tapOn:
    text: "zakulisje"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Hitrost"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "Hitrost"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/sl/25-trastienda
- tapOn:
    text: "Noč"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/sl/26-trastienda-noche
- tapOn:
    text: "Papir"
    optional: true
- scrollUntilVisible:
    element:
      text: "Navij papigo|Upravljaj naročnino"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/sl/27-trastienda-cuerda
- tapOn:
    text: "Navij papigo"
- extendedWaitUntil:
    visible:
      text: "Izberi svojo vzmet"
