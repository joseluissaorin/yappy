appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "ठीक है"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/hi/20-cinta
- tapOn:
    text: "परदे के पीछे"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "रफ़्तार"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "रफ़्तार"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/hi/25-trastienda
- tapOn:
    text: "रात"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/hi/26-trastienda-noche
- tapOn:
    text: "काग़ज़"
    optional: true
- scrollUntilVisible:
    element:
      text: "तोते में चाबी भरें|सदस्यता प्रबंधित करें"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/hi/27-trastienda-cuerda
- tapOn:
    text: "तोते में चाबी भरें"
- extendedWaitUntil:
    visible:
      text: "अपनी चाबी चुनिए"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/hi/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(hi)"
      AppleLocale: "hi_HI"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "ठीक है"
    optional: true
- tapOn:
    text: "(?i)प्रेस खोलें"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/hi/29-imprenta
- launchApp:
