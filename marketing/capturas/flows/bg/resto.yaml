appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Добре"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/bg/20-cinta
- tapOn:
    text: "задната стаичка"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Скорост"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "Скорост"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/bg/25-trastienda
- tapOn:
    text: "Нощ"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/bg/26-trastienda-noche
- tapOn:
    text: "Хартия"
    optional: true
- scrollUntilVisible:
    element:
      text: "Навий папагала|Управление на абонамента"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/bg/27-trastienda-cuerda
- tapOn:
    text: "Навий папагала"
- extendedWaitUntil:
    visible:
      text: "Избери си пружината"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/bg/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(bg)"
      AppleLocale: "bg_BG"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Добре"
    optional: true
- tapOn:
    text: "(?i)отвори печатницата"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/bg/29-imprenta
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(bg)"
      AppleLocale: "bg_BG"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Добре"
