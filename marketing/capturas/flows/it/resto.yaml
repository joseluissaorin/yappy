appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Va bene"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/it/20-cinta
- tapOn:
    text: "il retrobottega"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Velocità"
    commands:
      - tapOn:
          point: "96%,33%"
- extendedWaitUntil:
    visible:
      text: "Velocità"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/it/25-trastienda
- tapOn:
    text: "Notte"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots/it/26-trastienda-noche
- tapOn:
    text: "Carta"
    optional: true
- scrollUntilVisible:
    element:
      text: "Dare la carica al pappagallo|Gestisci l'abbonamento"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots/it/27-trastienda-cuerda
- tapOn:
    text: "Dare la carica al pappagallo"
- extendedWaitUntil:
    visible:
      text: "Scegli la tua carica"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/it/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(it)"
      AppleLocale: "it_IT"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Va bene"
    optional: true
- tapOn:
    text: "(?i)apri la stamperia"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots/it/29-imprenta
