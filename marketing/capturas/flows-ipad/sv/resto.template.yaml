appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Okej"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/sv/20-cinta
- tapOn:
    text: "bakrummet"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Hastighet"
    commands:
      - tapOn:
          point: "97%,30%"
- extendedWaitUntil:
    visible:
      text: "Hastighet"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/sv/25-trastienda
- tapOn:
    text: "Natt"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/sv/26-trastienda-noche
- tapOn:
    text: "Papper"
    optional: true
- scrollUntilVisible:
    element:
      text: "Dra upp papegojan|Hantera prenumerationen"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/sv/27-trastienda-cuerda
- tapOn:
    text: "Dra upp papegojan"
- extendedWaitUntil:
    visible:
      text: "Välj din fjäder"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/sv/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(sv)"
      AppleLocale: "sv_SV"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Okej"
    optional: true
- tapOn:
    text: "(?i)öppna tryckeriet"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/sv/29-imprenta
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(sv)"
      AppleLocale: "sv_SV"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Okej"
    optional: true
- tapOn:
    text: "(?i)__TITULO__"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Lyssna"
