appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Está bem"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/pt/20-cinta
- tapOn:
    text: "os bastidores"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Velocidade"
    commands:
      - tapOn:
          point: "97%,30%"
- extendedWaitUntil:
    visible:
      text: "Velocidade"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/pt/25-trastienda
- tapOn:
    text: "Noite"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/pt/26-trastienda-noche
- tapOn:
    text: "Papel"
    optional: true
- scrollUntilVisible:
    element:
      text: "Dar corda ao papagaio|Gerir a subscrição"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/pt/27-trastienda-cuerda
- tapOn:
    text: "Dar corda ao papagaio"
- extendedWaitUntil:
    visible:
      text: "Escolhe a tua corda"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/pt/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(pt)"
      AppleLocale: "pt_PT"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Está bem"
    optional: true
- tapOn:
    text: "(?i)abrir a tipografia"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/pt/29-imprenta
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(pt)"
      AppleLocale: "pt_PT"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Está bem"
    optional: true
- tapOn:
    text: "(?i)Pão caseiro"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Ouvir"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/pt/21-lector-a
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots-ipad/pt/22-lector-b
