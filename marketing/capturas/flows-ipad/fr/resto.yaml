appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "D'accord"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/fr/20-cinta
- tapOn:
    text: "l'arrière-boutique"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Vitesse"
    commands:
      - tapOn:
          point: "97%,30%"
- extendedWaitUntil:
    visible:
      text: "Vitesse"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/fr/25-trastienda
- tapOn:
    text: "Nuit"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/fr/26-trastienda-noche
- tapOn:
    text: "Papier"
    optional: true
- scrollUntilVisible:
    element:
      text: "Remonter le perroquet|Gérer l'abonnement"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/fr/27-trastienda-cuerda
- tapOn:
    text: "Remonter le perroquet"
- extendedWaitUntil:
    visible:
      text: "Choisis ton remontage"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/fr/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(fr)"
      AppleLocale: "fr_FR"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "D'accord"
    optional: true
- tapOn:
    text: "(?i)ouvrir l’imprimerie"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/fr/29-imprenta
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(fr)"
      AppleLocale: "fr_FR"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "D'accord"
    optional: true
- tapOn:
    text: "(?i)Pain de campagne"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Écouter"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/fr/21-lector-a
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots-ipad/fr/22-lector-b
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots-ipad/fr/23-lector-c
- takeScreenshot: marketing/screenshots-ipad/fr/24-cinta-sonando
