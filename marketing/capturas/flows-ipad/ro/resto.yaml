appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Bine"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/ro/20-cinta
- tapOn:
    text: "camera din spate"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Viteză"
    commands:
      - tapOn:
          point: "97%,30%"
- extendedWaitUntil:
    visible:
      text: "Viteză"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/ro/25-trastienda
- tapOn:
    text: "Noapte"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/ro/26-trastienda-noche
- tapOn:
    text: "Hârtie"
    optional: true
- scrollUntilVisible:
    element:
      text: "Întoarce-i cheița papagalului|Gestionează abonamentul"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/ro/27-trastienda-cuerda
- tapOn:
    text: "Întoarce-i cheița papagalului"
- extendedWaitUntil:
    visible:
      text: "Alege-ți cheița"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/ro/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(ro)"
      AppleLocale: "ro_RO"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Bine"
    optional: true
- tapOn:
    text: "(?i)deschide tipografia"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/ro/29-imprenta
- launchApp:
