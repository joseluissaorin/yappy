- tapOn:
    text: "저에게 목소리를 골라 주세요"
- extendedWaitUntil:
    visible:
      text: "모든 게 당신의 휴대폰 안에서 이루어져요"
    timeout: 10000
- tapOn:
    text: "Français"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/ko/02-paseo-idiomas
- tapOn:
    text: "다음"
- extendedWaitUntil:
    visible:
      text: "당신의 새를 골라 주세요"
