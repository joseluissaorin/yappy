      text: "Hallo, ich bin dein Papagei"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/de/01-paseo-hola
- tapOn:
    text: "Wähl mir eine Stimme"
- extendedWaitUntil:
    visible:
      text: "Alles passiert auf deinem Handy"
    timeout: 10000
- tapOn:
    text: "Français"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/de/02-paseo-idiomas
- tapOn:
    text: "Weiter"
- extendedWaitUntil:
    visible:
      text: "Wähl deinen Vogel"
    timeout: 10000
- tapOn:
    text: "James"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/de/03-paseo-pajaro
- tapOn:
    text: "Ich nehme James"
- extendedWaitUntil:
