- tapOn:
    text: "(?i)Später"
- extendedWaitUntil:
    visible:
      text: "Und du nimmst es mit"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/de/10-paseo-exportar
- tapOn:
    text: "(?i)Später"
