      text: "Wie schnell\\?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/de/06-paseo-velocidad
- tapOn:
    text: "Weiter"
- extendedWaitUntil:
    visible:
      text: "Wie viel hast du zu lesen\\?"
    timeout: 10000
- tapOn:
    text: "Einen ganzen Berg"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/de/07-paseo-cuanto
- tapOn:
    text: "Weiter"
- extendedWaitUntil:
    visible:
