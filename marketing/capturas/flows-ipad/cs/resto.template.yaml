appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Dobře"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/cs/20-cinta
- tapOn:
    text: "zákulisí"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Rychlost"
    commands:
      - tapOn:
          point: "97%,30%"
- extendedWaitUntil:
    visible:
      text: "Rychlost"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/cs/25-trastienda
- tapOn:
    text: "Noc"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/cs/26-trastienda-noche
- tapOn:
    text: "Papír"
    optional: true
- scrollUntilVisible:
    element:
      text: "Natáhnout papouška|Spravovat předplatné"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/cs/27-trastienda-cuerda
- tapOn:
    text: "Natáhnout papouška"
- extendedWaitUntil:
    visible:
      text: "Vyber si svou pružinu"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/cs/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(cs)"
      AppleLocale: "cs_CS"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Dobře"
    optional: true
- tapOn:
    text: "(?i)otevřít tiskárnu"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/cs/29-imprenta
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(cs)"
      AppleLocale: "cs_CS"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Dobře"
    optional: true
- tapOn:
    text: "(?i)__TITULO__"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Poslechnout"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/cs/21-lector-a
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots-ipad/cs/22-lector-b
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: marketing/screenshots-ipad/cs/23-lector-c
- takeScreenshot: marketing/screenshots-ipad/cs/24-cinta-sonando
