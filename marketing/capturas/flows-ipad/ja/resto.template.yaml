appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "わかりました"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/ja/20-cinta
- tapOn:
    text: "楽屋"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "速さ"
    commands:
      - tapOn:
          point: "97%,30%"
- extendedWaitUntil:
    visible:
      text: "速さ"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/ja/25-trastienda
- tapOn:
    text: "夜"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/ja/26-trastienda-noche
- tapOn:
    text: "紙"
    optional: true
- scrollUntilVisible:
    element:
      text: "オウムのぜんまいを巻く|サブスクリプションを管理"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/ja/27-trastienda-cuerda
- tapOn:
    text: "オウムのぜんまいを巻く"
- extendedWaitUntil:
    visible:
      text: "ぜんまいを選ぶ"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/ja/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(ja)"
      AppleLocale: "ja_JA"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "わかりました"
    optional: true
- tapOn:
    text: "(?i)印刷所を開く"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/ja/29-imprenta
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(ja)"
      AppleLocale: "ja_JA"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "わかりました"
    optional: true
- tapOn:
    text: "(?i)__TITULO__"
