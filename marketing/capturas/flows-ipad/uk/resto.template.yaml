appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Гаразд"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/uk/20-cinta
- tapOn:
    text: "підсобка"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Швидкість"
    commands:
      - tapOn:
          point: "97%,30%"
- extendedWaitUntil:
    visible:
      text: "Швидкість"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/uk/25-trastienda
- tapOn:
    text: "Ніч"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/uk/26-trastienda-noche
- tapOn:
    text: "Папір"
    optional: true
- scrollUntilVisible:
    element:
      text: "Завести папугу|Керувати підпискою"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/uk/27-trastienda-cuerda
- tapOn:
    text: "Завести папугу"
- extendedWaitUntil:
    visible:
      text: "Обери, як завести папугу"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/uk/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(uk)"
      AppleLocale: "uk_UK"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Гаразд"
    optional: true
- tapOn:
    text: "(?i)відкрити друкарню"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/uk/29-imprenta
- launchApp:
    stopApp: true
    arguments:
