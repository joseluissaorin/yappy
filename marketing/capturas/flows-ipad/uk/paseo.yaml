      text: "З якою швидкістю\\?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/uk/06-paseo-velocidad
- tapOn:
    text: "Далі"
