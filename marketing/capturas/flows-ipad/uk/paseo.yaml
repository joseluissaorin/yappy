appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: "Привіт, я твій папуга"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/uk/01-paseo-hola
- tapOn:
    text: "Обери мені голос"
- extendedWaitUntil:
    visible:
      text: "Усе відбувається на твоєму телефоні"
    timeout: 10000
- tapOn:
    text: "Français"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/uk/02-paseo-idiomas
- tapOn:
    text: "Далі"
- extendedWaitUntil:
    visible:
      text: "Обери свого птаха"
    timeout: 10000
- tapOn:
    text: "James"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/uk/03-paseo-pajaro
- tapOn:
    text: "Залишаюся на James"
- extendedWaitUntil:
    visible:
      text: "Що ти мені даси\\?"
    timeout: 10000
- tapOn:
    text: "Статті"
