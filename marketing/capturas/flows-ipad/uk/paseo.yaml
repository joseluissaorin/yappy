    text: "(?i)Пізніше"
- extendedWaitUntil:
    visible:
      text: "Поділитися вирішує все"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/uk/09-paseo-compartir
- tapOn:
    text: "(?i)Пізніше"
- extendedWaitUntil:
    visible:
