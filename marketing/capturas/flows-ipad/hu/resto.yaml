- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Sebesség"
    commands:
      - tapOn:
          point: "97%,30%"
- extendedWaitUntil:
    visible:
      text: "Sebesség"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/hu/25-trastienda
