appId: com.joseluissaorin.yappy
---
- launchApp:
    stopApp: false
- tapOn:
    point: "30%,3%"
- tapOn:
    text: "Được"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/vi/20-cinta
- tapOn:
    text: "hậu trường"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      notVisible:
        text: "Tốc độ"
    commands:
      - tapOn:
          point: "97%,30%"
- extendedWaitUntil:
    visible:
      text: "Tốc độ"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/vi/25-trastienda
- tapOn:
    text: "Đêm"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: marketing/screenshots-ipad/vi/26-trastienda-noche
- tapOn:
    text: "Giấy"
    optional: true
- scrollUntilVisible:
    element:
      text: "Lên dây cót cho chú vẹt|Quản lý gói đăng ký"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marketing/screenshots-ipad/vi/27-trastienda-cuerda
- tapOn:
    text: "Lên dây cót cho chú vẹt"
- extendedWaitUntil:
    visible:
      text: "Chọn dây cót của bạn"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/vi/28-paywall
# Relanzar en vez de volver atrás: la cinta se conserva y no hay flecha que acertar.
- launchApp:
    stopApp: true
    arguments:
      AppleLanguages: "(vi)"
      AppleLocale: "vi_VI"
- extendedWaitUntil:
    visible:
      text: "yappy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Được"
    optional: true
- tapOn:
    text: "(?i)mở xưởng in"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marketing/screenshots-ipad/vi/29-imprenta
- launchApp:
